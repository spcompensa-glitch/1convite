name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Web Application
        run: npm run build
        working-directory: frontend

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: frontend

      - name: Build Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to public
        run: |
          mkdir -p frontend/public
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/public/1convite.apk

      - name: Commit and Push APK back to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/1convite.apk
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao detectada no APK."
          else
            git commit -m "build: Atualiza arquivo APK nativo do Android [skip ci]"
            git push origin main
          fi
